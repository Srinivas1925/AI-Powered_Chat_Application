<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body,html {
            height:100%;
            margin:0;
            padding:0;
            font-family:Arial,sans-serif;
            background-color:#e9f0f7;
        }
        .chat{
            display:flex;
            flex-direction:column;
            height:100vh;
            max-width:600px;
            margin:auto;
            box-shadow: 0 0 10px beige;
            background-color: aliceblue;
        }
        .chat-header{
            padding: 15px;
            background-color:blue;
            color: white;
            text-align: center;
        }
        .chat-body{
            flex-grow: 1;
            padding:15px;
            overflow-y: auto;
            background-color: #f7f9fc;
        }
        .chat-message{
            margin: 10px 0;
            padding: 10px;
            border-radius:5px;
            width: fit-content;
            max-width: 80%;
        }
        .chat-message.user{
            background-color:#007bff;
            color: antiquewhite;
            align-self: flex-end;
        }
        .chat-message.bot{
            background-color: #e9ecef;
            color: #000;
            align-self: flex-start;
        }
        .chat-footer{
            padding:15px;
            background-color: antiquewhite;
            display: flex;
            align-items:center;
            border-top: 1px solid antiquewhite;
        }
        .chat-footer input{
            flex-grow:1;
            margin-right: 10px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .chat-footer button{
            padding: 8px 16px;
            border-radius:5px;
            border:none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .chat-footer button:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="chat">
        <div class="chat-header">CHATBOX</div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-footer">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function (){
            $('#send-button').click(sendMessage);
            $('#message-input').keypress(function(e) {
                if (e.which === 13) sendMessage();
            });

            function sendMessage(){
                var userMessage = $('#message-input').val().trim();
                if (!userMessage) return;

    
                $('#chat-body').append('<div class="chat-message user">'+userMessage+'</div>');
                $('#message-input').val("");
                $('#chat-body').scrollTop($('#chat-body')[0].scrollHeight);

        
                $.ajax({
                    url: '/chat',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ "message": userMessage }),
                    success: function(response){
                        $('#chat-body').append('<div class="chat-message bot">'+response.reply+'</div>');
                        $('#chat-body').scrollTop($('#chat-body')[0].scrollHeight);
                    },
                    error: function(xhr, status, error) {
    console.error("Error:", error);
    
    var errorMessage = "Sorry, something went wrong.";

    if (xhr.responseJSON && xhr.responseJSON.reply) {
        errorMessage = xhr.responseJSON.reply;
    }

    $('#chat-body').append(
        '<div class="chat-message bot">' + errorMessage + '</div>'
    );

    $('#chat-body').scrollTop(
        $('#chat-body')[0].scrollHeight
    );
}
                    }
                });
            }
        });
    </script>
</body>
</html>
